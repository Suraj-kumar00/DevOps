name: 🐛 Site bug
description: Something on the website itself is broken (layout, search, links, build).
title: '[Bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        For wrong or outdated content, use the "Content is wrong or outdated" form instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: When I try to... what happens is...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Browsers
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, console errors, device or screen size.
