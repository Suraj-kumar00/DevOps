version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so compromised or broken versions are
    # usually caught first. Security updates are not delayed by this setting.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      fumadocs:
        patterns: ['fumadocs-*', '@fumadocs/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
