name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run types:check
      - run: npm test

      # Also validates every page's frontmatter against the content contract.
      - run: npm run build

      - name: Smoke test the production server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          for path in / /docs /docs/ai-infra /docs/page-template /blogs /llms.txt /docs/ai-infra.md /sitemap.xml; do
            curl -fsS -o /dev/null -w "%{http_code} ${path}\n" "http://127.0.0.1:3000${path}"
          done

  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm audit --omit=dev --audit-level=high

      # Verifies registry signatures and provenance attestations of installed packages.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures

  dependency-review:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: devops-learning-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
