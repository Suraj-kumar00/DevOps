name: PR automation

# `pull_request_target` runs in the context of the base repository so it can label PRs from forks.
# That is only safe because no job here checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            content
            style
            refactor
            perf
            test
            build
            ci
            chore
