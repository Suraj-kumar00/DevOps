# actions/labeler v7 configuration: https://github.com/actions/labeler#usage
content:
  - changed-files:
      - any-glob-to-any-file: ['content/**']

website:
  - changed-files:
      - any-glob-to-any-file: ['app/**', 'components/**', 'lib/**', 'public/**', 'proxy.ts']

infrastructure:
  - changed-files:
      - any-glob-to-any-file: ['Dockerfile', '.dockerignore', '*.config.*', '.github/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['*.md']
